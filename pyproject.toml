[project]
name = "audit-scope-lab"
version = "0.1.0"
description = "Controlled agent experiments on access, reporting, and audit scope"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
audit-lab = "auditlab.cli:main"

[tool.setuptools.packages.find]
include = ["auditlab*"]
