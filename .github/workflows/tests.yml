name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m auditlab.cli plan --stage pilot --out manifests/pilot.json
      - run: python -m auditlab.cli run --models configs/models.json --model deepseek_r1 --mock --manifest manifests/pilot.json --out results/mock --limit 4
      - run: python -m auditlab.cli verify --results results/mock
      - run: python -m auditlab.cli plan --stage network_pilot --team-sizes 4 --budget-profile frontier --out manifests/network-pilot.json
      - run: python -m auditlab.cli run --models configs/models.json --model deepseek_r1 --mock --manifest manifests/network-pilot.json --out results/network-mock --limit 4
      - run: python -m auditlab.cli verify --results results/network-mock
      - run: python -m auditlab.cli analyze --results results/network-mock --out results/network-summary.json
      - run: python -m auditlab.cli replay-index --results results/network-mock --out artifacts/network-replay.json
