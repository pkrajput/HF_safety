name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m auditlab.cli plan --stage pilot --out manifests/pilot.json
      - run: python -m auditlab.cli run --models configs/models.json --model qwen --mock --manifest manifests/pilot.json --out results/mock --limit 4
      - run: python -m auditlab.cli verify --results results/mock
